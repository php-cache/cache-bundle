services:
  array_cache:
    class: Cache\Adapter\PHPArray\ArrayCachePool
    public: true

framework:
  profiler:
    enabled: true
  session: true

cache:
  session:
    enabled: true
    service_id: array_cache
    ttl: 7200

  router:
    enabled: true
    service_id: array_cache
    ttl: 86400

  data_collector:
    enabled: true
